<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b6bcb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulačka offsetové hypotéky</title>
    <meta
      name="description"
      content="Porovnejte offsetovou hypotéku s klasickou hypotékou, spořicími účty a mimořádnými splátkami."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="Kalkulačka offsetové hypotéky" />
    <meta
      property="og:description"
      content="Vyplatí se offsetová hypotéka? Porovnejte ji s klasickou hypotékou, spořicími účty a mimořádnými splátkami. Počítá se jen ve vašem prohlížeči."
    />
    <meta property="og:url" content="https://rexcze.github.io/offsetova-hypoteka/" />
  </head>
  <body>
    <script>
      // Set the theme before the first paint so the page does not flash. Storage may be blocked.
      try {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
